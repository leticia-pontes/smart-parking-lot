services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
      - "${MQTT_WS_PORT}:9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  api:
    build: .
    container_name: parking_api
    restart: unless-stopped
    depends_on:
      - db
      - mosquitto
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_URL: mqtt://mosquitto:1883
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS}
      STUCK_THRESHOLD_MINUTES: ${STUCK_THRESHOLD_MINUTES}
      FLAPPING_WINDOW_MINUTES: ${FLAPPING_WINDOW_MINUTES}
      FLAPPING_TRANSITIONS_THRESHOLD: ${FLAPPING_TRANSITIONS_THRESHOLD}
      SIMULATOR_CONTROL_URL: http://simulator:${SIMULATOR_PORT}
    ports:
      - "${PORT}:${PORT}"

  simulator:
    build: .
    container_name: parking_simulator
    command: npm run simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIMULATOR_PORT: ${SIMULATOR_PORT}
      SIM_TIME_SCALE_MS: ${SIM_TIME_SCALE_MS}
      SIM_AUTO_FAULTS: ${SIM_AUTO_FAULTS:-true}
      SIM_MAX_AUTO_FAULTS: ${SIM_MAX_AUTO_FAULTS:-4}
      SIM_FAULT_CHANCE: ${SIM_FAULT_CHANCE:-0.035}
      SIM_FAULTS: ${SIM_FAULTS:-}
    ports:
      - "${SIMULATOR_PORT}:${SIMULATOR_PORT}"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
